[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Windows-only / optional at runtime; the tools fail honestly without them:
    #   psutil (battery, active window), pywin32 (active window),
    #   pyautogui (YouTube/tab keystrokes, screen capture),
    #   pytesseract (screen OCR — also needs the free Tesseract
    #   engine binary installed on the machine; rapidocr-onnxruntime
    #   was removed — see tools/perception.py)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
