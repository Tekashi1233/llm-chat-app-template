<style>
:root{--cyan:#ffcf4d;--red:#ff8f00;--ink:#f8ecd2;--font:Rajdhani,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#05060a;overflow:hidden}
body{font-family:var(--font);color:var(--ink)}
#holo{position:fixed;inset:0;width:100%;height:100%;display:block}
.title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:22px;font-size:20px;font-weight:600;letter-spacing:.45em;color:var(--cyan);text-shadow:0 0 14px rgba(255,179,0,.55);pointer-events:none;z-index:2}
.title img{width:30px;height:30px;vertical-align:-7px;margin-right:10px;filter:drop-shadow(0 0 8px rgba(255,179,0,.7))}
#holo{cursor:grab;touch-action:none}
#holo.dragging{cursor:grabbing}
.box .icon-btn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,179,0,.35);cursor:pointer;display:grid;place-items:center;color:var(--cyan);background:rgba(16,12,4,.6)}
.box .icon-btn[hidden]{display:none}
.box .icon-btn.on{color:#1a1000;background:linear-gradient(135deg,#ffd54f,#ff8f00);box-shadow:0 0 16px rgba(255,179,0,.5);border-color:transparent}
.box .icon-btn.listening{color:#1a1000;background:linear-gradient(135deg,#ff5f5f,#ff8f00);box-shadow:0 0 16px rgba(255,95,95,.6);border-color:transparent}
.box .icon-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.chat{position:fixed;left:22px;top:50%;transform:translateY(-50%);width:min(400px,38vw);max-height:64vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:22px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);z-index:2}
.chat::-webkit-scrollbar{display:none}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:none;z-index:2}
.dock>*{pointer-events:auto}
.msg{max-width:94%;font-size:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 0 10px #05060a,0 0 4px #05060a}
.msg.user{align-self:flex-end;text-align:right;color:var(--cyan)}
.msg.ai{align-self:flex-start}
.msg.err{color:var(--red)}
.box{width:min(680px,100%);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 22px;border-radius:999px;background:rgba(16,12,4,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,179,0,.35);box-shadow:0 0 28px rgba(255,179,0,.12),0 0 40px rgba(255,143,0,.08);transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:rgba(255,207,77,.8);box-shadow:0 0 30px rgba(255,179,0,.25),0 0 44px rgba(255,143,0,.12)}
.box input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 17px var(--font);padding:10px 0}
.box input::placeholder{color:#8a7a52}
.box button{width:42px;height:42px;flex:none;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#1a1000;background:linear-gradient(135deg,#ffd54f,#ff8f00);box-shadow:0 0 16px rgba(255,179,0,.5)}
.box button:disabled{opacity:.4;cursor:default}
.box button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (max-width: 860px){
  .title{font-size:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .chat{left:16px;right:16px;top:auto;bottom:104px;transform:none;width:auto;max-height:30vh}
  .box{width:100%}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>

<script>
// Permanent Tailscale Funnel + n8n production webhook.
const WORKER_URL = "https://llm-chat-app-template.thanosabdulla.workers.dev/api/chat";

// One conversation per browser, kept across visits so VESPER remembers it.
let conversationId = localStorage.getItem('vesper_conversation_id');
if (!conversationId){
  conversationId = (crypto.randomUUID ? crypto.randomUUID() : 'conv-' + Date.now() + '-' + Math.random().toString(36).slice(2));
  localStorage.setItem('vesper_conversation_id', conversationId);
}

/* ---------- hologram: golden disc (like the reference image) ---------- */
const GOLD = new THREE.Color('#ffb300'), AMBER = new THREE.Color('#ff8f00'), PALE = new THREE.Color('#ffd54f');
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('holo'), antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x05060a, 1);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, 1, .1, 60);
const disc = new THREE.Group();
disc.rotation.x = -0.42; // tilted toward the viewer, like the reference
scene.add(disc);

const additive = (o, extra) => Object.assign({transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false}, extra);

// concentric glowing rings
const ringMat = (c, o) => new THREE.MeshBasicMaterial(additive(o, {color: c}));
function torus(r, tube, color, opacity){
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 160), ringMat(color, opacity));
  disc.add(m); return m;
}
const rings = [
  {m: torus(2.05, .012, GOLD, .9), spd: .12},
  {m: torus(1.78, .008, PALE, .55), spd: -.18},
  {m: torus(1.5, .01, GOLD, .7), spd: .22},
  {m: torus(1.18, .008, AMBER, .5), spd: -.3},
  {m: torus(.85, .01, PALE, .8), spd: .35},
];

// partial arc segments on the rings, for the HUD feel
function arc(r, tube, a0, len, color, opacity){
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 80, len), ringMat(color, opacity));
  m.rotation.z = a0; disc.add(m); return m;
}
const arcs = [
  {m: arc(1.78, .022, 0, 1.4, GOLD, .9), spd: -.25},
  {m: arc(1.5, .022, 2.2, 1.1, PALE, .9), spd: .3},
  {m: arc(1.18, .018, 4.0, 1.8, GOLD, .8), spd: -.4},
];

// radial tick marks around the outer ring
const tickPos = [];
for (let i = 0; i < 72; i++){
  const a = i/72 * Math.PI*2, r1 = 2.14, r2 = (i % 6 === 0) ? 2.3 : 2.22;
  tickPos.push(Math.cos(a)*r1, Math.sin(a)*r1, 0, Math.cos(a)*r2, Math.sin(a)*r2, 0);
}
const tickGeo = new THREE.BufferGeometry();
tickGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tickPos), 3));
const ticks = new THREE.LineSegments(tickGeo, new THREE.LineBasicMaterial(additive(.6, {color: GOLD})));
disc.add(ticks);

// horizontal beam through the middle (sticks out past the disc, like the reference)
const beam = new THREE.Mesh(new THREE.PlaneGeometry(4.6, .055), new THREE.MeshBasicMaterial(additive(.85, {color: PALE})));
disc.add(beam);
const beamCore = new THREE.Mesh(new THREE.PlaneGeometry(4.6, .015), new THREE.MeshBasicMaterial(additive(1, {color: 0xfff6c9})));
disc.add(beamCore);

// soft glow texture + bright dense core
function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.2, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const gt = glowTexture();
const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial(additive(.9, {map: gt, color: GOLD})));
coreGlow.scale.setScalar(1.7); disc.add(coreGlow);
const coreDot = new THREE.Mesh(new THREE.CircleGeometry(.16, 32), new THREE.MeshBasicMaterial(additive(1, {color: 0xfff3b0})));
disc.add(coreDot);

// glowing beads orbiting on the rings
const beads = [];
[[2.05, .5, GOLD], [1.5, 2.1, PALE], [1.18, 4.2, GOLD]].forEach(([r, a, c]) => {
  const b = new THREE.Mesh(new THREE.SphereGeometry(.045, 12, 12), new THREE.MeshBasicMaterial(additive(1, {color: c})));
  disc.add(b); beads.push({m: b, r, a, spd: .5 + Math.random()*.4});
});

// golden dust floating around the disc
const F = 420, fp = new Float32Array(F*3);
for (let i = 0; i < F; i++){
  const r = 2.3 + Math.random()*2.2, a = Math.random()*Math.PI*2;
  fp.set([Math.cos(a)*r, Math.sin(a)*r*.55, (Math.random()-.5)*1.2], i*3);
}
const fg = new THREE.BufferGeometry();
fg.setAttribute('position', new THREE.BufferAttribute(fp, 3));
const dust = new THREE.Points(fg, new THREE.PointsMaterial(additive(.65, {size: .03, color: 0xffc94d})));
scene.add(dust);

/* Drag offset for the gold disc (declared before resize() uses it) */
const drag = {x: 0, y: 0};
try {
  const saved = JSON.parse(localStorage.getItem('vesper_disc_pos') || 'null');
  if (saved && typeof saved.x === 'number' && typeof saved.y === 'number'){ drag.x = saved.x; drag.y = saved.y; }
} catch (e){ /* ignore a bad saved position */ }

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w/h;
  cam.position.z = Math.max(7.2, 5.3/cam.aspect);
  disc.position.x = (cam.aspect > 1.1 ? 1.0 : 0) + drag.x; // shift right on wide screens so it clears the reply panel, plus your drag
  cam.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ---------- moveable disc: drag the gold circle with the mouse ---------- */
const holoCanvas = document.getElementById('holo');
let dragging = null;
function worldPerPixel(){
  return (2 * cam.position.z * Math.tan((cam.fov/2) * Math.PI/180)) / window.innerHeight;
}
holoCanvas.addEventListener('pointerdown', e => {
  dragging = {sx: e.clientX, sy: e.clientY, ox: drag.x, oy: drag.y};
  holoCanvas.classList.add('dragging');
  try { holoCanvas.setPointerCapture(e.pointerId); } catch (e){}
});
holoCanvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const s = worldPerPixel();
  drag.x = Math.max(-2.2, Math.min(2.2, dragging.ox + (e.clientX - dragging.sx) * s));
  drag.y = Math.max(-1.8, Math.min(1.8, dragging.oy - (e.clientY - dragging.sy) * s));
});
function endDrag(){
  if (!dragging) return;
  dragging = null;
  holoCanvas.classList.remove('dragging');
  try { localStorage.setItem('vesper_disc_pos', JSON.stringify(drag)); } catch (e){}
}
holoCanvas.addEventListener('pointerup', endDrag);
holoCanvas.addEventListener('pointercancel', endDrag);

let thinking = false, speed = 1, pulse = 0;
const motion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? .3 : 1;
const t0 = performance.now(); let last = t0;

function frame(now){
  const t = (now-t0)/1000, dt = Math.min((now-last)/1000, .05); last = now;
  speed += ((thinking ? 2.4 : 1) - speed)*.04;
  pulse += ((thinking ? 1 : 0) - pulse)*.05;
  const m = motion, beat = .5 + .5*Math.sin(t*6);

  disc.position.y = .45 + Math.sin(t*.6)*.06*m + drag.y; // sits above the message box, plus your drag
  disc.rotation.y = Math.sin(t*.25)*.12*m; // gentle sway, tilt stays
  rings.forEach(r => { r.m.rotation.z += dt*r.spd*speed*m; });
  arcs.forEach(a => { a.m.rotation.z += dt*a.spd*speed*m; });
  beads.forEach(b => { b.a += dt*b.spd*speed*m; b.m.position.set(Math.cos(b.a)*b.r, Math.sin(b.a)*b.r, 0); });
  ticks.rotation.z -= dt*.03*speed*m;
  dust.rotation.z += dt*.015*m;

  coreGlow.scale.setScalar(1.7 * (1 + .06*Math.sin(t*1.4) + pulse*(.12 + .1*beat)));
  coreGlow.material.opacity = .75 + .2*Math.sin(t*1.6) + pulse*.2*beat;
  beam.material.opacity = .7 + .15*Math.sin(t*1.2) + pulse*.25*beat;
  beamCore.material.opacity = .9 + pulse*.1;

  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- chat ---------- */
const chat = document.getElementById('chat'), form = document.getElementById('form');
const inp = document.getElementById('msg'), btn = document.getElementById('send');

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = (cls.indexOf('ai') === 0) ? cleanReply(text) : text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// Strip Markdown/LaTeX clutter from AI replies so they read as plain text:
// removes $ signs, \frac{a}{b} -> (a/b), \sqrt{x} -> sqrt(x), **bold**, `code`,
// # headings, and converts \times, \rightarrow etc. to plain words.
function cleanReply(t){
  return t
    .replace(/\$\$/g, '')
    .replace(/\$/g, '')
    .replace(/\\[\[\]\(\)]/g, '')
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1/$2)')
    .replace(/\\sqrt\{([^{}]*)\}/g, 'sqrt($1)')
    .replace(/\\text\{([^{}]*)\}/g, '$1')
    .replace(/\\left|\\right/g, '')
    .replace(/\\times/g, 'x')
    .replace(/\\cdot/g, '.')
    .replace(/\\div/g, '/')
    .replace(/\\pi/g, 'pi')
    .replace(/\\rightarrow/g, '->')
    .replace(/\\approx/g, '~')
    .replace(/\\leq/g, '<=')
    .replace(/\\geq/g, '>=')
    .replace(/\\%/g, '%')
    .replace(/\*\*([^*]*)\*\*/g, '$1')
    .replace(/__([^_]*)__/g, '$1')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^>\s?/gm, '')
    .replace(/^\s*[-*]\s+/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

addMsg("Hey Abdullah, what's up?", 'ai');

/* ---------- voice: speak replies (off unless you turn it on) ---------- */
const voiceBtn = document.getElementById('voice');
const micBtn = document.getElementById('mic');
let voiceOn = false;
try { voiceOn = localStorage.getItem('vesper_voice_on') === '1'; } catch (e){}
const SPEAKER_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
function showVoiceState(){
  voiceBtn.classList.toggle('on', voiceOn);
  voiceBtn.innerHTML = voiceOn ? SPEAKER_ON : SPEAKER_OFF;
  voiceBtn.setAttribute('aria-label', voiceOn ? 'Voice replies on' : 'Voice replies off');
  voiceBtn.title = voiceOn ? 'Voice replies on' : 'Voice replies off';
  if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
}
voiceBtn.addEventListener('click', () => {
  voiceOn = !voiceOn;
  try { localStorage.setItem('vesper_voice_on', voiceOn ? '1' : '0'); } catch (e){}

showVoiceState();

let chosenVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const male = /male|daniel|george|guy|ryan|brian|arthur/i;
  chosenVoice = vs.find(v => v.lang && v.lang.toLowerCase().indexOf('en-gb') === 0 && male.test(v.name))
    || vs.find(v => v.lang && v.lang.toLowerCase().indexOf('en-gb') === 0)
    || vs.find(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0)
    || null;
}
if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
function speak(text){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (chosenVoice) u.voice = chosenVoice;
  u.lang = 'en-GB';
  speechSynthesis.speak(u);
}

/* ---------- microphone: talk instead of typing ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let listening = false, recog = null;
if (SR){
  micBtn.hidden = false;
  recog = new SR();
  recog.lang = 'en-GB';
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  recog.addEventListener('result', e => {
    const said = e.results[0][0].transcript.trim();
    if (said){ inp.value = said; form.requestSubmit(); }
  });
  recog.addEventListener('end', () => { listening = false; micBtn.classList.remove('listening'); });
  recog.addEventListener('error', () => { listening = false; micBtn.classList.remove('listening'); });
  micBtn.addEventListener('click', () => {
    if (listening){ recog.stop(); return; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    try { recog.start(); listening = true; micBtn.classList.add('listening'); }
    catch (e){ listening = false; micBtn.classList.remove('listening'); }
  });
}

// Ask the Cloudflare Worker: POST {messages:[...]} to /api/chat,
// read the streamed reply (Server-Sent Events), keep only the visible
// text parts and join them into one plain reply.
async function ask(text){
  for (let a = 0; a < 2; a++){
    try {
      const r = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({messages: [{role: 'user', content: text}], conversation_id: conversationId})
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '', out = '', finished = false;
      while (!finished){
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf('\n')) >= 0){
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]'){ finished = true; break; }
          try {
            const d = JSON.parse(payload);
            const delta = d.choices && d.choices[0] && d.choices[0].delta;
            if (delta && delta.content) out += delta.content;
          } catch (e){ /* ignore partial lines */ }
        }
      }
      if (!out.trim()) throw new Error('Empty reply from VESPER');
      return out;
    } catch (e){
      if (e instanceof TypeError && a === 0){ await new Promise(r => setTimeout(r, 900)); continue; }
      throw e;
    }
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text || thinking) return;
  addMsg(text, 'user');
  inp.value = '';
  thinking = true; btn.disabled = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  try { const reply = await ask(text); addMsg(reply, 'ai'); speak(reply); }
  catch (err){ addMsg('Connection failed: ' + err.message, 'ai err'); }
  thinking = false; btn.disabled = false; inp.focus();
});
